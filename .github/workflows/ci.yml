name: OrderLab Python CI

on:
  push:
    paths:
      - "orderlab-project/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "orderlab-project/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: orderlab-project

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-dev.txt
      - name: Test with coverage
        run: python -m pytest --cov=orderlab --cov-report=xml -q
      - name: Upload coverage report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: orderlab-project/coverage.xml
          if-no-files-found: ignore
