name: Issue on Push Example
on:
  push:
permissions:
  issues: write
jobs:
  create-issue:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Create Issue with GitHub CLI
        run: |
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues" \
            -f title="Push Event - ${GITHUB_SHA:0:7}" \
            -f body="A push event occurred.
          Repository: $GITHUB_REPOSITORY
          Branch: $GITHUB_REF_NAME
          Commit: $GITHUB_SHA
          Author: $GITHUB_ACTOR" \
            --jq '.html_url'

